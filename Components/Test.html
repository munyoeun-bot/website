<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School UI</title>
<style>
  :root {
  --primary: #16a34a;
  --bg: #ffffff;
  --text: #0f172a;
}

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Kantumruy Pro', sans-serif;
}

/* BODY */
body {
  background: var(--bg);
  color: var(--text);
  transition: 0.4s;
}

/* NAV */
nav {
  position: fixed;
  width: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid #ddd;
}

.nav-container {
  max-width: 1200px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
}

/* LOGO */
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
}

/* MENU */
.menu {
  display: flex;
  align-items: center;
  gap: 15px;
}

.menu a,
.dropdown-toggle {
  text-decoration: none;
  color: var(--text);
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 8px;
}

/* hover */
.menu a:hover,
.dropdown-toggle:hover {
  background: var(--primary);
  color: white;
}

/* DROPDOWN */
.dropdown {
  position: relative;
}

.dropdown-content {
  position: absolute;
  top: 45px;
  left: 0;
  min-width: 180px;

  background: white;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);

  display: none;
  flex-direction: column;
}

.dropdown-content a {
  padding: 10px;
  text-decoration: none;
  color: black;
}

.dropdown-content a:hover {
  background: var(--primary);
  color: white;
}

.dropdown.active .dropdown-content {
  display: flex;
}

/* MODE */
.mode {
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
}

.mode:hover {
  background: var(--primary);
  color: white;
}

/* HAMBURGER */
.hamburger {
  display: none;
}

/* DARK MODE */
html.dark body {
  background: linear-gradient(135deg, #16a34a, #0f172a);
  color: white;
}

html.dark nav {
  background: rgba(22,163,74,0.85);
}

html.dark .menu a,
html.dark .dropdown-toggle {
  color: white;
}

html.dark .dropdown-content {
  background: #0f172a;
}

html.dark .dropdown-content a {
  color: white;
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<!-- 🔥 Load dark mode before page renders -->
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>

</head>

<body>

<nav id="nav">
  <div class="nav-container">

    <div class="logo">
      <img src="https://via.placeholder.com/50">
      <div>
        <h3>School Name</h3>
        <small>Institute</small>
      </div>
    </div>

    <div class="menu">

      <a href="#">Home</a>

      <div class="dropdown">
        <div class="dropdown-toggle">Info ▾</div>
        <div class="dropdown-content">
          <a href="#">Item 1</a>
          <a href="#">Item 2</a>
        </div>
      </div>

      <a href="#">Contact</a>

      <div class="mode">🌙</div>

      <div class="hamburger">☰</div>

    </div>

  </div>
</nav>
<script>
  const modeBtn = document.querySelector(".mode");

// LOAD MODE ON PAGE OPEN
if (localStorage.getItem("theme") === "dark") {
  document.documentElement.classList.add("dark");
}

// ICON UPDATE
function updateIcon() {
  modeBtn.innerHTML = document.documentElement.classList.contains("dark")
    ? "☀️"
    : "🌙";
}

updateIcon();

// TOGGLE DARK MODE
modeBtn.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");

  const isDark = document.documentElement.classList.contains("dark");

  localStorage.setItem("theme", isDark ? "dark" : "light");

  updateIcon();
});

// DROPDOWN
document.querySelectorAll(".dropdown-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    btn.parentElement.classList.toggle("active");
  });
});
</script>

<script src="script.js"></script>
</body>
</html>
