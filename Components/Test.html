<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Mode Toggle</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

/* BODY */
body{
  background:#ffffff;
  color:#111;
  transition: background 0.3s, color 0.3s;
}

/* DARK MODE */
body.dark{
  background:#0f172a;
  color:#e5e7eb;
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 10%;
  background:#f1f5f9;
  transition:0.3s;
}

body.dark nav{
  background:#020617;
}

/* LOGO */
.logo{
  font-size:20px;
  font-weight:bold;
}

/* MENU */
.menu a{
  margin-left:20px;
  text-decoration:none;
  color:inherit;
  font-size:16px;
}

/* TOGGLE BUTTON */
.mode{
  cursor:pointer;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#e5e7eb;
  transition: all 0.3s ease;
}

.mode i{
  font-size:18px;
  color:#111;
  transition: all 0.3s ease;
}

.mode:hover{
  transform: rotate(25deg) scale(1.1);
}

/* DARK BUTTON */
body.dark .mode{
  background:#1e293b;
}

body.dark .mode i{
  color:#facc15;
}

/* HERO SECTION */
.hero{
  height:80vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.hero h1{
  font-size:40px;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;
  opacity:0.7;
}

/* BUTTON */
.btn{
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#1d4ed8;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">MySite</div>

  <div class="menu">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <!-- DARK MODE TOGGLE -->
  <div class="mode" id="modeToggle">
    <i id="modeIcon" class="fa-solid fa-moon"></i>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Dark Mode Website</h1>
  <p>Click the icon to switch theme 🌙 / ☀️</p>
  <button class="btn">Get Started</button>
</section>

<script>
const toggle = document.getElementById("modeToggle");
const icon = document.getElementById("modeIcon");

// LOAD SAVED MODE
if(localStorage.getItem("theme") === "dark"){
  document.body.classList.add("dark");
  icon.classList.replace("fa-moon","fa-sun");
}

// CLICK EVENT
toggle.addEventListener("click", () => {
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    icon.classList.replace("fa-moon","fa-sun");
    localStorage.setItem("theme","dark");
  }else{
    icon.classList.replace("fa-sun","fa-moon");
    localStorage.setItem("theme","light");
  }
});
</script>

</body>
</html>
