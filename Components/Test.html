<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហ្គេមអាប៉ោង - កំណែគ្មានសម្លេង</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            font-family: 'Kantumruy Pro', sans-serif;
            overflow: hidden;
        }

        .app-container {
            width: 360px;
            height: 680px;
            background: linear-gradient(180deg, #2c3e50 0%, #000000 100%);
            border-radius: 35px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 5px solid #16213e;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .header { margin-top: 50px; text-align: center; }
        .header h2 { font-size: 24px; margin-bottom: 5px; }
        .warning { color: #ff4d4d; font-weight: bold; font-size: 14px; }

        .game-area {
            position: relative;
            margin-top: 40px;
            width: 340px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ចានធំខាងក្រោម */
        .big-plate {
            position: absolute;
            width: 330px; 
            height: 220px;
            background: radial-gradient(ellipse at center, #ffffff 0%, #bdc3c7 60%, #95a5a6 100%);
            border-radius: 50%;
            border: 8px solid #dfe6e9;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .dice-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-stick {
            position: absolute;
            width: 7px;
            height: 150px;
            background: #2d3436;
            border-radius: 4px;
            z-index: 1;
        }

        .dice {
            width: 70px;
            height: 110px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            font-weight: bold;
            color: #2d3436;
            z-index: 2;
        }

        /* ចានក្រប */
        .plate-cover {
            position: absolute;
            width: 260px; 
            height: 180px;
            background: linear-gradient(180deg, #ecf0f1 0%, #95a5a6 100%);
            border-radius: 130px 130px 30px 30px;
            top: 5px;
            z-index: 10;
            display: flex;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.2), opacity 0.4s;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.7);
        }

        .cover-handle {
            width: 45px;
            height: 20px;
            background: #2d3436;
            border-radius: 20px 20px 0 0;
            margin-top: -18px;
        }

        .cover-open {
            transform: translateY(-210px) rotate(-15deg);
            opacity: 0;
            pointer-events: none;
        }

        /* ប៊ូតុង */
        .button-group {
            margin-top: 80px;
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            color: white;
            font-family: 'Kantumruy Pro', sans-serif;
            transition: 0.1s;
        }

        .btn-spin { background-color: #0984e3; box-shadow: 0 6px 0 #074b83; }
        .btn-open { background-color: #00b894; box-shadow: 0 6px 0 #008168; }

        .btn:active {transform: translateY(4px); box-shadow: none; }
        .btn:disabled { background-color: #636e72; box-shadow: 0 6px 0 #2d3436; cursor: not-allowed; }

        .spinning { animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 1px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, 1px); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h2>តោះចាក់អាប៉ោងលេង</h2>
            <p class="warning">តែកុំលេងមែនទែន</p>
        </div>

        <div class="game-area">
            <div class="big-plate"></div>
            <div class="dice-wrapper" id="dice-target">
                <div class="back-stick"></div>
                <div id="dice" class="dice">?</div>
            </div>
            <div id="cover" class="plate-cover">
                <div class="cover-handle"></div>
            </div>
        </div>

        <div class="button-group">
            <button id="btn-spin" class="btn btn-spin" onclick="spin()">បង្វិល</button>
            <button id="btn-open" class="btn btn-open" onclick="openPlate()" disabled>បើក</button>
        </div>
    </div>

    <script>
        const dice = document.getElementById('dice');
        const cover = document.getElementById('cover');
        const target = document.getElementById('dice-target');
        const bSpin = document.getElementById('btn-spin');
        const bOpen = document.getElementById('btn-open');

        const faces = ['១', '២', '៣', '៤', '៥', '៦'];

        function spin() {
            cover.classList.remove('cover-open');
            dice.innerText = "?";
            bSpin.disabled = true;
            bOpen.disabled = true;

            setTimeout(() => {
                target.classList.add('spinning');

                setTimeout(() => {
                    target.classList.remove('spinning');
                    dice.innerText = faces[Math.floor(Math.random() * faces.length)];
                    bOpen.disabled = false;
                    bSpin.disabled = false;
                }, 1500);
            }, 500);
        }

        function openPlate() {
            cover.classList.add('cover-open');
            bOpen.disabled = true;
        }
    </script>
</body>
</html>
